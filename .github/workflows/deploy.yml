name: Deploy backend to S3 + EC2 (PM2)

# ★ PM2 CHANGE — What changed vs. the systemd version:
#   • The zip now excludes node_modules/ and logs/ in addition to the
#     previous exclusions (neither should ever be shipped).
#   • The SSM bootstrap command is identical — bootstrap.sh itself handles
#     the systemd→PM2 migration and all PM2 setup.
#   • All other steps are unchanged; the health-check still runs inside
#     bootstrap.sh and the SSM wait loop picks up success/failure.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-east-1
  BUCKET: s3general-148535751717-ap-east-1-an
  INSTANCE_ID: i-00c16218eb325facf
  SERVICE_NAME: mytradingagents-backend
  APP_ROOT: /opt/myTradingAgentsBackend

permissions:
  id-token: write   # needed for OIDC role assumption
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Preferred: OIDC role (no long-lived keys).
          #role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # If you use access keys instead, delete role-to-assume above and use:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # ★ PM2 CHANGE — added node_modules/ and logs/ to exclusion list
      - name: Package backend
        run: |
          set -euo pipefail
          zip -r backend.zip . \
            -x '.git/*' '.github/*' '.venv/*' 'node_modules/*' \
               '**/__pycache__/*' '*.pyc' \
               'data/*' 'artifacts/*' 'logs/*' '.env'
          unzip -l backend.zip | tail -n 5

      - name: Upload release to S3
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          aws s3 cp backend.zip "s3://${BUCKET}/releases/${SHA}/backend.zip"
          printf '%s' "${SHA}" > release.txt
          aws s3 cp release.txt "s3://${BUCKET}/current/release.txt"
          # keep the bootstrap script on S3 in sync with the repo copy
          if [ -f scripts/bootstrap.sh ]; then
            aws s3 cp scripts/bootstrap.sh "s3://${BUCKET}/scripts/bootstrap.sh"
          fi

      - name: Seed .env to S3 config (if secret is available)
        env:
          APP_ENV_B64: ${{ secrets.APP_ENV_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${APP_ENV_B64:-}" ]; then
            echo "${APP_ENV_B64}" | base64 -d | aws s3 cp - "s3://${BUCKET}/config/.env"
            echo "Uploaded .env to s3://${BUCKET}/config/.env"
          else
            echo "APP_ENV_B64 secret not set; skipping .env upload (bootstrap will use fallback)"
          fi

      - name: Trigger deployment on EC2 via SSM
        id: ssm
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/ssm-commands.json
          import base64
          import json
          import os
          import shlex
          from pathlib import Path
          
          bootstrap_b64 = base64.b64encode(Path("scripts/bootstrap.sh").read_bytes()).decode()
          commands = [
              "set -euxo pipefail",
              f"printf '%s\\n' '{bootstrap_b64}' > /tmp/bootstrap.sh.b64",
              "base64 -d /tmp/bootstrap.sh.b64 > /tmp/bootstrap.sh",
              "rm -f /tmp/bootstrap.sh.b64",
              "chmod +x /tmp/bootstrap.sh",
              # Code and config currently share the same deployment bucket.
              f"export APP_ROOT={shlex.quote(os.environ['APP_ROOT'])}",
              f"export CODE_BUCKET={shlex.quote(os.environ['BUCKET'])}",
              f"export CONFIG_BUCKET={shlex.quote(os.environ['BUCKET'])}",
              f"export SERVICE_NAME={shlex.quote(os.environ['SERVICE_NAME'])}",
              f"export PM2_APP_NAME={shlex.quote(os.environ['SERVICE_NAME'])}",
              "bash /tmp/bootstrap.sh",
          ]
          print(json.dumps({"commands": commands}))
          PY
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA} (PM2)" \
            --parameters "file:///tmp/ssm-commands.json" \
            --query 'Command.CommandId' --output text)
          echo "command_id=${CMD_ID}" >> "$GITHUB_OUTPUT"
          echo "SSM command: ${CMD_ID}"

      - name: Wait for deployment to finish
        run: |
          set -euo pipefail
          CMD_ID="${{ steps.ssm.outputs.command_id }}"
          FAILED=0
          STATUS="Unknown"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "${CMD_ID}" --details \
              --query 'CommandInvocations[0].Status' --output text)
            echo "status: ${STATUS}"
            case "${STATUS}" in
              Success) break ;;
              Failed|Cancelled|TimedOut) echo "deploy failed"; FAILED=1; break ;;
            esac
            sleep 10
          done
          aws ssm list-command-invocations --command-id "${CMD_ID}" --details \
            --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text || true
          if [ "${FAILED}" = "1" ] || [ "${STATUS}" != "Success" ]; then
            exit 1
          fi